  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Images/ic_launcher.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
  - assets/Images/
  - assets/bank_logos/
  - assets/Icons/
  - assets/login_icons/
  - assets/subscriptions/
  - assets/lottie/
  - assets/tuitorial/
  - assets/svgs/
  - .env

fonts:
- family: Sans
  fonts:
  - asset: assets/fonts/google_sans/ProductSans-Regular.ttf

ios_ignored_dependencies:
  another_telephony: ^0.4.1

ios_ignored_files:
- lib/features/dashboard/components/home/utils/utils.dart
- lib/utils/message_reading_service/scheduller.dart
- lib/utils/message_reading_service/parser.dart

ios_files_to_modify:
  lib/features/dashboard/components/home/home.dart:
  - import 'package:fedha/utils/message_reading_service/scheduller.dart';
  - import 'package:fedha/features/dashboard/components/home/utils/utils.dart';
  - showSmsDialog(context);
  - |
    readMessages({
      'installationDate': null,
      'lastReadTimestamp': null,
    });

  lib/main.dart:
  - import 'package:fedha/utils/message_reading_service/scheduller.dart';
  - initializeServices();
  - "Workmanager().initialize(callbackDispatcher, isInDebugMode: false);"
